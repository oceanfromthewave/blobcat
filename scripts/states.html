<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1100px; height: 300px; }
  body {
    background: radial-gradient(1100px 500px at 50% -20%, #20232b 0%, #141518 60%, #101113 100%);
    font-family: "Segoe UI", system-ui, sans-serif; color: #e8e8ea; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 26px 36px; height: 100%; display: flex; flex-direction: column; }
  .h { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .h span { color: #ff9fb3; }
  .row { flex: 1; display: flex; gap: 16px; margin-top: 18px; }
  .cell {
    flex: 1; background: #1b1d22; border: 1px solid #2a2d35; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    position: relative;
  }
  .cell svg { width: 96px; height: 96px; overflow: visible; }
  .cap { font-size: 14.5px; font-weight: 700; color: #d4d7de; }
  .sub { font-size: 12px; color: #7d828c; margin-top: -6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="h">One cat, lots of <span>moods</span> 🐱</div>
    <div class="row" id="row"></div>
  </div>
<script>
function cat(opts) {
  opts = opts || {};
  const color = opts.color || '#FFFFFF';
  const cheek = opts.cheek || '#FFD1DC';
  // eyes
  let eyes;
  if (opts.eyes === 'closed') {
    eyes = `<path d="M36 56 Q40 59 44 56" fill="none" stroke="#333" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M56 56 Q60 59 64 56" fill="none" stroke="#333" stroke-width="2.4" stroke-linecap="round"/>`;
  } else if (opts.eyes === 'happy') {
    eyes = `<path d="M36 57 Q40 53 44 57" fill="none" stroke="#333" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M56 57 Q60 53 64 57" fill="none" stroke="#333" stroke-width="2.4" stroke-linecap="round"/>`;
  } else {
    eyes = `<circle cx="40" cy="55" r="4" fill="#333"/><circle cx="38.8" cy="53.8" r="1.2" fill="#fff"/>
            <circle cx="60" cy="55" r="4" fill="#333"/><circle cx="58.8" cy="53.8" r="1.2" fill="#fff"/>`;
  }
  const mouth = opts.mouth === 'big'
    ? `<path d="M43 64 Q50 74 57 64" fill="none" stroke="#333" stroke-width="2"/>`
    : `<path d="M45 65 Q50 70 55 65" fill="none" stroke="#333" stroke-width="2"/>`;
  return `
  <svg viewBox="0 0 100 100" style="color:${color}">
    ${opts.deco || ''}
    <path d="M 78 75 Q 92 68 90 52" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 80 Q20 40 50 40 Q80 40 80 80 Z" fill="currentColor" stroke="#E0E0E0" stroke-width="2"/>
    <path d="M34 41 Q30 30 40 38 Z" fill="currentColor" stroke="#E0E0E0"/>
    <path d="M35 39 Q32 33 38 37 Z" fill="#FFD1DC"/>
    <path d="M66 41 Q70 30 60 38 Z" fill="currentColor" stroke="#E0E0E0"/>
    <path d="M65 39 Q68 33 62 37 Z" fill="#FFD1DC"/>
    ${eyes}
    <circle cx="32" cy="62" r="5" fill="${cheek}"/>
    <circle cx="68" cy="62" r="5" fill="${cheek}"/>
    ${mouth}
  </svg>`;
}
function heart(x, y, s) {
  return `<path transform="translate(${x},${y}) scale(${s})" d="M5 9 Q0 5.5 0 2.8 Q0 0 2.5 0 Q4 0 5 1.6 Q6 0 7.5 0 Q10 0 10 2.8 Q10 5.5 5 9 Z" fill="#FF4D6D"/>`;
}
function dot(x, y) { return `<circle cx="${x}" cy="${y}" r="2.4" fill="#FFD1DC"/>`; }

const states = [
  { cap: 'Idle', sub: 'just chilling', svg: cat({}) },
  { cap: 'You type', sub: 'jumps + particles', svg: cat({ eyes: 'happy', mouth: 'big',
      deco: dot(22,84)+dot(34,90)+dot(66,90)+dot(78,84)+dot(50,92) }) },
  { cap: 'Click to pet', sub: 'wiggle + hearts', svg: cat({ eyes: 'happy', cheek: '#FF6F8A',
      deco: heart(30,8,1.3)+heart(50,2,1.6)+heart(66,10,1.3) }) },
  { cap: 'Idle 30s', sub: 'dozes off', svg: cat({ eyes: 'closed',
      deco: `<text x="74" y="34" font-family="Segoe UI" font-size="13" font-weight="700" fill="#9aa0aa">z</text>
             <text x="84" y="24" font-family="Segoe UI" font-size="10" font-weight="700" fill="#9aa0aa">z</text>` }) },
];
document.getElementById('row').innerHTML = states.map(s =>
  `<div class="cell">${s.svg}<div class="cap">${s.cap}</div><div class="sub">${s.sub}</div></div>`
).join('');
</script>
</body>
</html>
